<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E9498" />
    <title>Pulso · Sin conexión</title>
    <!--
      Pantalla de respaldo de la app (server.errorPath en capacitor.config.ts). Capacitor la carga
      cuando Pulso no abre (sin internet, el servidor no responde). TODO va en línea: Capacitor
      solo sirve esta página desde https://localhost; cualquier otro archivo de www/ no se serviría.
    -->
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: linear-gradient(150deg, #0E9498, #13B0A0);
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        text-align: center;
      }
      main { max-width: 22rem; display: flex; flex-direction: column; align-items: center; gap: 20px; }
      .marca { width: 88px; height: 88px; border-radius: 22px; background: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(6, 60, 62, .28); }
      h1 { font-size: 1.35rem; font-weight: 700; margin: 0; }
      p { margin: 0; line-height: 1.5; opacity: .92; }
      button {
        font: inherit; font-weight: 700; color: #0A7376; background: #fff; border: 0;
        border-radius: 999px; padding: 14px 32px; min-width: 12rem; min-height: 48px; cursor: pointer;
      }
      button:active { transform: scale(.98); }
      button:disabled { opacity: .6; }
    </style>
  </head>
  <body>
    <main>
      <div class="marca">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="60" height="60" aria-hidden="true" focusable="false">
          <path d="M10 32h12l5-14 10 28 6-18 4 8h7" fill="none" stroke="#0E9498" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1>Pulso</h1>
      <p>Sin conexión. Revisa tu internet y vuelve a intentar.</p>
      <button type="button" id="reintentar">Reintentar</button>
    </main>
    <script>
      // El destino llega en ?panel= (capacitor.config.ts, rutaDeRespaldo). Solo se acepta https:
      // esta página no navega a ningún otro lado.
      (function () {
        var POR_DEFECTO = 'https://pulso-sitirt.pages.dev/login';
        var destino = POR_DEFECTO;
        try {
          var dado = new URLSearchParams(location.search).get('panel');
          if (dado && new URL(dado).protocol === 'https:') destino = new URL(dado).origin + '/login';
        } catch (e) {
          destino = POR_DEFECTO;
        }
        var boton = document.getElementById('reintentar');
        boton.addEventListener('click', function () {
          boton.disabled = true;
          boton.textContent = 'Conectando…';
          location.replace(destino);
        });
      })();
    </script>
  </body>
</html>
